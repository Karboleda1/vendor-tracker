<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>K's Collective</title>

<!-- Make "Add to Home Screen" behave like a real app on iOS/Android -->

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23002147'/%3E%3Ctext x='50' y='64' font-size='48' font-family='Georgia,serif' fill='white' text-anchor='middle'%3EK%3C/text%3E%3C/svg%3E" />
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23002147'/%3E%3Ctext x='50' y='64' font-size='48' font-family='Georgia,serif' fill='white' text-anchor='middle'%3EK%3C/text%3E%3C/svg%3E" />

<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback } = React;

/* ---- Minimal local icon set (replaces lucide-react for standalone use) ---- */
function Icon({ size = 16, strokeWidth = 2, className = "", children }) {
  return (
    <svg
      width={size}
      height={size}
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      strokeWidth={strokeWidth}
      strokeLinecap="round"
      strokeLinejoin="round"
      className={className}
    >
      {children}
    </svg>
  );
}
const Plus = (props) => (
  <Icon {...props}>
    <line x1="12" y1="5" x2="12" y2="19" />
    <line x1="5" y1="12" x2="19" y2="12" />
  </Icon>
);
const Minus = (props) => (
  <Icon {...props}>
    <line x1="5" y1="12" x2="19" y2="12" />
  </Icon>
);
const Check = (props) => (
  <Icon {...props}>
    <polyline points="20 6 9 17 4 12" />
  </Icon>
);
const ChevronDown = (props) => (
  <Icon {...props}>
    <polyline points="6 9 12 15 18 9" />
  </Icon>
);
const Trash2 = (props) => (
  <Icon {...props}>
    <polyline points="3 6 5 6 21 6" />
    <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
    <path d="M10 11v6" />
    <path d="M14 11v6" />
    <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2" />
  </Icon>
);
const DollarSign = (props) => (
  <Icon {...props}>
    <line x1="12" y1="1" x2="12" y2="23" />
    <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" />
  </Icon>
);
const Package = (props) => (
  <Icon {...props}>
    <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z" />
    <polyline points="3.29 7 12 12 20.71 7" />
    <line x1="12" y1="22" x2="12" y2="12" />
  </Icon>
);
const Receipt = (props) => (
  <Icon {...props}>
    <path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z" />
    <path d="M16 8h-6" />
    <path d="M16 12h-6" />
    <path d="M13 16h-3" />
  </Icon>
);
const LayoutGrid = (props) => (
  <Icon {...props}>
    <rect x="3" y="3" width="7" height="7" rx="1" />
    <rect x="14" y="3" width="7" height="7" rx="1" />
    <rect x="14" y="14" width="7" height="7" rx="1" />
    <rect x="3" y="14" width="7" height="7" rx="1" />
  </Icon>
);

/* ---- localStorage-backed shim for window.storage (Claude artifact API) ---- */
window.storage = {
  get: async (key) => {
    try {
      const v = localStorage.getItem(key);
      return v === null ? null : { key, value: v, shared: false };
    } catch (e) {
      return null;
    }
  },
  set: async (key, value) => {
    try {
      localStorage.setItem(key, value);
      return { key, value, shared: false };
    } catch (e) {
      return null;
    }
  },
  delete: async (key) => {
    localStorage.removeItem(key);
    return { key, deleted: true, shared: false };
  },
  list: async (prefix) => {
    const keys = Object.keys(localStorage).filter((k) => !prefix || k.startsWith(prefix));
    return { keys, shared: false };
  },
};


const STORAGE_KEY = "vendor-tracker-v2";

const uid = () => Math.random().toString(36).slice(2, 10);
const todayISO = () => new Date().toISOString().slice(0, 10);

const emptyShow = (date) => ({
  id: uid(),
  date: date || todayISO(),
  float: 150,
  buyingPower: 0,
  sales: [],
  purchases: [],
  expenses: [],
});

function makeInitialState() {
  const show = emptyShow();
  return { inventory: [], shows: [show], activeShowId: show.id, textColor: "#111111" };
}

// Migrate older single-show save formats into the multi-show structure.
function migrate(raw) {
  if (raw && Array.isArray(raw.shows)) {
    return { textColor: "#111111", ...raw, shows: raw.shows.map((s) => ({ buyingPower: 0, ...s })) };
  }
  if (raw && Array.isArray(raw.inventory)) {
    const show = emptyShow(raw.date);
    show.float = raw.float ?? 150;
    show.sales = raw.sales ?? [];
    show.purchases = raw.purchases ?? [];
    show.expenses = raw.expenses ?? [];
    return { inventory: raw.inventory, shows: [show], activeShowId: show.id, textColor: "#111111" };
  }
  return makeInitialState();
}

function hexToRgb(hex) {
  const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex || "#111111");
  if (!m) return { r: 17, g: 17, b: 17 };
  return { r: parseInt(m[1], 16), g: parseInt(m[2], 16), b: parseInt(m[3], 16) };
}

function textColorVars(hex) {
  const { r, g, b } = hexToRgb(hex);
  return {
    "--tc": `rgb(${r}, ${g}, ${b})`,
    "--tc-80": `rgba(${r}, ${g}, ${b}, 0.8)`,
    "--tc-50": `rgba(${r}, ${g}, ${b}, 0.5)`,
    "--tc-40": `rgba(${r}, ${g}, ${b}, 0.4)`,
  };
}

function formatDateLabel(iso) {
  if (!iso) return "";
  const [y, m, d] = iso.split("-").map(Number);
  const dt = new Date(y, m - 1, d);
  return dt.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
}

function Money({ value, size = "base" }) {
  const sizes = { sm: "text-sm", base: "text-base", lg: "text-2xl", xl: "text-4xl" };
  const negative = value < 0;
  return (
    <span className={`font-mono tabular-nums ${sizes[size]}`}>
      {negative ? "-" : ""}${Math.abs(value).toFixed(2)}
    </span>
  );
}

function ShowTracker() {
  const [data, setData] = useState(null);
  const [tab, setTab] = useState("summary");
  const [saveState, setSaveState] = useState("idle");
  const [switcherOpen, setSwitcherOpen] = useState(false);

  useEffect(() => {
    (async () => {
      try {
        const res = await window.storage.get(STORAGE_KEY, false);
        if (res && res.value) setData(migrate(JSON.parse(res.value)));
        else setData(makeInitialState());
      } catch (e) {
        setData(makeInitialState());
      }
    })();
  }, []);

  const persist = useCallback(async (next) => {
    setData(next);
    setSaveState("saving");
    try {
      await window.storage.set(STORAGE_KEY, JSON.stringify(next), false);
      setSaveState("saved");
    } catch (e) {
      setSaveState("error");
    }
  }, []);

  if (!data) {
    return (
      <div className="min-h-screen flex items-center justify-center bg-[#FFFFFF]">
        <div className="font-mono text-sm" style={{ color: "var(--tc)" }}>loading ledger…</div>
      </div>
    );
  }

  const activeShow = data.shows.find((s) => s.id === data.activeShowId) || data.shows[0];

  const updateShow = (patch) => {
    persist({
      ...data,
      shows: data.shows.map((s) => (s.id === activeShow.id ? { ...s, ...patch } : s)),
    });
  };

  const updateInventory = (inventory) => {
    persist({ ...data, inventory });
  };

  const switchShow = (id) => {
    persist({ ...data, activeShowId: id });
    setSwitcherOpen(false);
  };

  const addShow = (date) => {
    const show = emptyShow(date);
    persist({ ...data, shows: [show, ...data.shows], activeShowId: show.id });
    setSwitcherOpen(false);
  };

  const removeShow = (id) => {
    if (data.shows.length <= 1) return;
    const remaining = data.shows.filter((s) => s.id !== id);
    persist({
      ...data,
      shows: remaining,
      activeShowId: id === data.activeShowId ? remaining[0].id : data.activeShowId,
    });
  };

  const totalSales = activeShow.sales.reduce((s, x) => s + x.price, 0);
  const totalExpenses = activeShow.expenses.reduce((s, x) => s + x.amount, 0);
  const totalPurchases = activeShow.purchases.reduce((s, x) => s + x.cost, 0);
  const cashInBox = activeShow.float + totalSales - totalPurchases - totalExpenses;
  const netProfit = totalSales - totalPurchases - totalExpenses;
  const inventoryValue = data.inventory.reduce((s, x) => s + x.price * x.qty, 0);

  const setTextColor = (hex) => persist({ ...data, textColor: hex });

  return (
    <div
      className="min-h-screen bg-[#FFFFFF] flex flex-col"
      style={{ color: "var(--tc)", ...textColorVars(data.textColor) }}
    >
      <Header
        saveState={saveState}
        show={activeShow}
        shows={data.shows}
        switcherOpen={switcherOpen}
        setSwitcherOpen={setSwitcherOpen}
        switchShow={switchShow}
        addShow={addShow}
        removeShow={removeShow}
        updateShow={updateShow}
        textColor={data.textColor}
        setTextColor={setTextColor}
      />
      <main className="flex-1 overflow-y-auto pb-24 px-4 pt-4 max-w-md mx-auto w-full">
        {tab === "summary" && (
          <SummaryTab
            show={activeShow}
            inventory={data.inventory}
            updateShow={updateShow}
            totalSales={totalSales}
            totalExpenses={totalExpenses}
            totalPurchases={totalPurchases}
            cashInBox={cashInBox}
            netProfit={netProfit}
            inventoryValue={inventoryValue}
          />
        )}
        {tab === "inventory" && <InventoryTab inventory={data.inventory} updateInventory={updateInventory} />}
        {tab === "sell" && <SellTab show={activeShow} inventory={data.inventory} updateShow={updateShow} updateInventory={updateInventory} />}
        {tab === "buy" && <BuyTab show={activeShow} updateShow={updateShow} />}
      </main>
      <BottomNav tab={tab} setTab={setTab} />
    </div>
  );
}

function Header({ saveState, show, shows, switcherOpen, setSwitcherOpen, switchShow, addShow, removeShow, updateShow, textColor, setTextColor }) {
  const [newDate, setNewDate] = useState(todayISO());

  return (
    <header className="bg-[#002147] text-[#FFFFFF] px-4 pt-5 pb-4 relative">
      <div className="max-w-md mx-auto w-full flex items-baseline justify-between">
        <div>
          <p className="text-[10px] uppercase tracking-[0.2em] text-white/60 font-semibold">Show Day</p>
          <h1 className="text-xl font-semibold leading-tight text-white">K's Collective</h1>
        </div>
        <div className="flex items-center gap-2">
          <span className="text-[10px] font-mono text-[#FFFFFF]/50">
            {saveState === "saving" ? "saving…" : saveState === "error" ? "save failed" : "saved"}
          </span>
          <label
            title="Change text color"
            className="w-6 h-6 rounded-full border-2 border-white/70 overflow-hidden cursor-pointer shrink-0 relative"
            style={{ backgroundColor: textColor }}
          >
            <input
              type="color"
              value={textColor}
              onChange={(e) => setTextColor(e.target.value)}
              className="absolute inset-0 opacity-0 w-full h-full cursor-pointer"
            />
          </label>
        </div>
      </div>

      <div className="max-w-md mx-auto w-full mt-2">
        <button
          onClick={() => setSwitcherOpen(!switcherOpen)}
          className="flex items-center gap-1.5 text-sm font-mono text-[#FFFFFF]/90 bg-white/10 rounded-lg px-2.5 py-1.5"
        >
          {formatDateLabel(show.date)}
          {shows.length > 1 && <span className="text-[10px] text-[#FFFFFF]/50">({shows.length} shows)</span>}
          <ChevronDown size={14} className={`transition-transform ${switcherOpen ? "rotate-180" : ""}`} />
        </button>

        {switcherOpen && (
          <div className="mt-2 bg-[#FFFFFF] rounded-xl shadow-lg overflow-hidden" style={{ color: "var(--tc)" }}>
            <ul className="max-h-56 overflow-y-auto divide-y divide-[#002147]/10">
              {[...shows]
                .sort((a, b) => (a.date < b.date ? 1 : -1))
                .map((s) => (
                  <li key={s.id} className="flex items-center">
                    <button
                      onClick={() => switchShow(s.id)}
                      className="flex-1 flex items-center justify-between text-left px-3 py-2.5 text-sm"
                    >
                      <span className="flex items-center gap-2">
                        {s.id === show.id && <Check size={14} className="text-[#002147]" />}
                        {formatDateLabel(s.date)}
                      </span>
                      <span className="text-[11px]" style={{ color: "var(--tc-50)" }}>{s.sales.length} sales</span>
                    </button>
                    {shows.length > 1 && (
                      <button
                        onClick={() => removeShow(s.id)}
                        className="w-8 h-8 mr-2 rounded-full bg-[#002147]/8 text-[#002147] flex items-center justify-center shrink-0"
                      >
                        <Trash2 size={13} />
                      </button>
                    )}
                  </li>
                ))}
            </ul>
            <div className="p-2.5 border-t border-[#002147]/10 flex gap-2 items-center">
              <input
                type="date"
                value={newDate}
                onChange={(e) => setNewDate(e.target.value)}
                className="flex-1 border border-[#002147]/20 rounded-lg px-2 py-1.5 text-sm font-mono bg-white"
              />
              <button
                onClick={() => addShow(newDate)}
                className="bg-[#002147] text-white text-xs font-semibold px-3 py-1.5 rounded-lg flex items-center gap-1 shrink-0"
              >
                <Plus size={14} /> New show
              </button>
            </div>
          </div>
        )}

        {!switcherOpen && (
          <button
            onClick={() => setSwitcherOpen(true)}
            className="ml-2 text-[11px] text-[#FFFFFF]/60 underline decoration-dotted underline-offset-4"
          >
            change date
          </button>
        )}
      </div>
    </header>
  );
}

function Card({ children, className = "" }) {
  return (
    <div className={`bg-white border border-[#002147]/10 rounded-xl shadow-sm ${className}`}>
      {children}
    </div>
  );
}

function SectionLabel({ children }) {
  return (
    <p className="text-[10px] uppercase tracking-[0.15em] text-[#002147]/70 font-semibold mb-2">
      {children}
    </p>
  );
}

function SummaryTab({ show, inventory, updateShow, totalSales, totalExpenses, totalPurchases, cashInBox, netProfit, inventoryValue }) {
  const [editFloat, setEditFloat] = useState(false);
  const [floatInput, setFloatInput] = useState(String(show.float));
  const [editBuyingPower, setEditBuyingPower] = useState(false);
  const [buyingPowerInput, setBuyingPowerInput] = useState(String(show.buyingPower ?? 0));

  const saveFloat = () => {
    const v = parseFloat(floatInput) || 0;
    updateShow({ float: v });
    setEditFloat(false);
  };

  const saveBuyingPower = () => {
    const v = parseFloat(buyingPowerInput) || 0;
    updateShow({ buyingPower: v });
    setEditBuyingPower(false);
  };

  const recent = [...show.sales, ...show.purchases.map((p) => ({ ...p, isPurchase: true })), ...show.expenses.map((e) => ({ ...e, isExpense: true }))]
    .sort((a, b) => b.ts - a.ts)
    .slice(0, 8);

  const removeRecent = (r) => {
    if (r.isExpense) updateShow({ expenses: show.expenses.filter((e) => e.id !== r.id) });
    else if (r.isPurchase) updateShow({ purchases: show.purchases.filter((p) => p.id !== r.id) });
    else updateShow({ sales: show.sales.filter((s) => s.id !== r.id) });
  };

  return (
    <div className="space-y-4">
      <Card className="p-5 bg-[#002147] text-[#FFFFFF] border-none">
        <p className="text-[10px] uppercase tracking-[0.2em] text-white/60 font-semibold mb-1">Cash in the box</p>
        <Money value={cashInBox} size="xl" />
        <div className="flex gap-4 mt-3 text-[11px] text-[#FFFFFF]/70">
          <span>float ${show.float.toFixed(0)}</span>
          <span>·</span>
          <span>sales {show.sales.length}</span>
          <span>·</span>
          <span>{formatDateLabel(show.date)}</span>
        </div>
      </Card>

      <div className="grid grid-cols-2 gap-3">
        <Card className="p-4">
          <SectionLabel>Sales total</SectionLabel>
          <Money value={totalSales} size="lg" />
        </Card>
        <Card className="p-4">
          <SectionLabel>Net profit</SectionLabel>
          <Money value={netProfit} size="lg" />
        </Card>
        <Card className="p-4">
          <SectionLabel>Spent on stock</SectionLabel>
          <Money value={totalPurchases} size="lg" />
        </Card>
        <Card className="p-4">
          <SectionLabel>Other expenses</SectionLabel>
          <Money value={totalExpenses} size="lg" />
        </Card>
      </div>

      <Card className="p-4">
        <div className="flex items-center justify-between">
          <SectionLabel>Change float</SectionLabel>
          {!editFloat && (
            <button onClick={() => { setFloatInput(String(show.float)); setEditFloat(true); }} className="text-[11px] text-[#002147] font-semibold">
              edit
            </button>
          )}
        </div>
        {editFloat ? (
          <div className="flex gap-2 items-center">
            <span className="font-mono">$</span>
            <input
              type="number"
              inputMode="decimal"
              value={floatInput}
              onChange={(e) => setFloatInput(e.target.value)}
              className="border border-[#002147]/20 rounded-lg px-2 py-1 w-24 font-mono"
              autoFocus
            />
            <button onClick={saveFloat} className="bg-[#002147] text-[#FFFFFF] text-xs px-3 py-1.5 rounded-lg font-semibold">
              Save
            </button>
          </div>
        ) : (
          <Money value={show.float} size="base" />
        )}
        <p className="text-[11px] mt-1" style={{ color: "var(--tc-50)" }}>Set this before the show — it's not counted as profit. Each show keeps its own float.</p>
      </Card>

      <Card className="p-4">
        <div className="flex items-center justify-between">
          <SectionLabel>Buying power</SectionLabel>
          {!editBuyingPower && (
            <button onClick={() => { setBuyingPowerInput(String(show.buyingPower ?? 0)); setEditBuyingPower(true); }} className="text-[11px] text-[#002147] font-semibold">
              edit
            </button>
          )}
        </div>
        {editBuyingPower ? (
          <div className="flex gap-2 items-center">
            <span className="font-mono">$</span>
            <input
              type="number"
              inputMode="decimal"
              value={buyingPowerInput}
              onChange={(e) => setBuyingPowerInput(e.target.value)}
              className="border border-[#002147]/20 rounded-lg px-2 py-1 w-24 font-mono"
              autoFocus
            />
            <button onClick={saveBuyingPower} className="bg-[#002147] text-[#FFFFFF] text-xs px-3 py-1.5 rounded-lg font-semibold">
              Save
            </button>
          </div>
        ) : (
          <Money value={show.buyingPower ?? 0} size="base" />
        )}
        <p className="text-[11px] mt-1" style={{ color: "var(--tc-50)" }}>How much you've set aside to buy new stock at this show.</p>
      </Card>

      <Card className="p-4">
        <SectionLabel>Inventory on hand (shared across shows)</SectionLabel>
        <div className="flex items-baseline justify-between">
          <Money value={inventoryValue} size="lg" />
          <span className="text-[11px]" style={{ color: "var(--tc-50)" }}>{inventory.reduce((s, x) => s + x.qty, 0)} items · at tag price</span>
        </div>
      </Card>

      {recent.length > 0 && (
        <Card className="p-4">
          <SectionLabel>Recent activity</SectionLabel>
          <ul className="divide-y divide-[#002147]/8">
            {recent.map((r) => (
              <li key={r.id} className="py-2 flex justify-between items-center text-sm gap-2">
                <span className="truncate pr-2" style={{ color: "var(--tc-80)" }}>
                  {r.isExpense ? r.desc : r.isPurchase ? r.desc : r.item}
                </span>
                <span className="flex items-center gap-2 shrink-0">
                  <span className="font-mono text-xs" style={{ color: "var(--tc)" }}>
                    {r.isExpense || r.isPurchase ? "-" : "+"}${(r.amount ?? r.cost ?? r.price).toFixed(2)}
                  </span>
                  <button onClick={() => removeRecent(r)} className="w-6 h-6 rounded-full bg-[#002147]/8 text-[#002147] flex items-center justify-center">
                    <Trash2 size={12} />
                  </button>
                </span>
              </li>
            ))}
          </ul>
        </Card>
      )}
    </div>
  );
}

function InventoryTab({ inventory, updateInventory }) {
  const [form, setForm] = useState({ name: "", qty: 1, cost: "", price: "", type: "sealed" });

  const addItem = () => {
    if (!form.name || !form.price) return;
    const item = {
      id: uid(),
      name: form.name,
      qty: parseInt(form.qty) || 1,
      cost: parseFloat(form.cost) || 0,
      price: parseFloat(form.price) || 0,
      type: form.type,
    };
    updateInventory([item, ...inventory]);
    setForm({ name: "", qty: 1, cost: "", price: "", type: "sealed" });
  };

  const removeItem = (id) => {
    updateInventory(inventory.filter((i) => i.id !== id));
  };

  const adjustQty = (id, delta) => {
    updateInventory(inventory.map((i) => (i.id === id ? { ...i, qty: Math.max(0, i.qty + delta) } : i)));
  };

  const totalValue = inventory.reduce((s, x) => s + x.price * x.qty, 0);
  const totalUnits = inventory.reduce((s, x) => s + x.qty, 0);

  return (
    <div className="space-y-4">
      <Card className="p-4">
        <SectionLabel>Add to inventory</SectionLabel>
        <div className="space-y-2">
          <input
            placeholder="Item name (e.g. Prismatic Evolutions ETB)"
            value={form.name}
            onChange={(e) => setForm({ ...form, name: e.target.value })}
            className="w-full border border-[#002147]/20 rounded-lg px-3 py-2 text-sm"
          />
          <div className="flex gap-2">
            <div className="flex rounded-lg overflow-hidden border border-[#002147]/30 divide-x divide-[#002147]/30 text-xs shrink-0">
              {["sealed", "single"].map((t) => (
                <button
                  key={t}
                  type="button"
                  onClick={() => setForm((f) => ({ ...f, type: t }))}
                  className={`px-3 py-2.5 font-semibold capitalize cursor-pointer select-none flex items-center gap-1 transition-colors ${
                    form.type === t
                      ? "bg-[#002147] text-white ring-2 ring-inset ring-[#002147]"
                      : "bg-[#002147]/5 text-[#002147]/60"
                  }`}
                >
                  {form.type === t && <Check size={13} strokeWidth={3} />}
                  {t}
                </button>
              ))}
            </div>
            <input
              type="number"
              inputMode="numeric"
              placeholder="qty"
              value={form.qty}
              onChange={(e) => setForm({ ...form, qty: e.target.value })}
              className="w-16 min-w-0 shrink-0 border border-[#002147]/20 rounded-lg px-2 py-2 text-sm font-mono"
            />
          </div>
          <div className="flex gap-2">
            <input
              type="number"
              inputMode="decimal"
              placeholder="your cost"
              value={form.cost}
              onChange={(e) => setForm({ ...form, cost: e.target.value })}
              className="flex-1 min-w-0 w-full border border-[#002147]/20 rounded-lg px-3 py-2 text-sm font-mono"
            />
            <input
              type="number"
              inputMode="decimal"
              placeholder="tag price"
              value={form.price}
              onChange={(e) => setForm({ ...form, price: e.target.value })}
              className="flex-1 min-w-0 w-full border border-[#002147]/20 rounded-lg px-3 py-2 text-sm font-mono"
            />
          </div>
          <button type="button" onClick={addItem} className="w-full bg-[#002147] text-white font-bold text-sm py-3.5 rounded-lg flex items-center justify-center gap-2 shadow-md border-2 border-[#002147]">
            <Plus size={16} /> Add item
          </button>
        </div>
      </Card>

      <Card className="overflow-hidden">
        <div className="p-4 pb-2 flex items-center justify-between">
          <SectionLabel>Your inventory ({totalUnits} units)</SectionLabel>
          <Money value={totalValue} size="sm" />
        </div>

        {inventory.length === 0 ? (
          <p className="text-center text-sm py-6 px-4" style={{ color: "var(--tc-50)" }}>No items yet. Add your table stock above.</p>
        ) : (
          <div>
            <div className="grid grid-cols-[1fr_auto_auto] gap-2 px-4 py-1.5 text-[10px] uppercase tracking-wide font-semibold border-t border-b border-[#002147]/10 bg-[#002147]/[0.03]" style={{ color: "var(--tc-40)" }}>
              <span>Item</span>
              <span className="text-right">Qty</span>
              <span className="text-right w-14">Value</span>
            </div>
            <ul className="divide-y divide-[#002147]/8">
              {inventory.map((item) => (
                <li key={item.id} className="grid grid-cols-[1fr_auto_auto] gap-2 items-center px-4 py-3">
                  <div className="min-w-0">
                    <p className="text-sm font-medium truncate">{item.name}</p>
                    <p className="text-[11px] capitalize" style={{ color: "var(--tc-50)" }}>
                      {item.type} · cost <Money value={item.cost} size="sm" /> · tag <Money value={item.price} size="sm" />
                    </p>
                  </div>
                  <div className="flex items-center gap-1">
                    <button type="button" onClick={() => adjustQty(item.id, -1)} className="w-6 h-6 rounded-full bg-[#002147]/10 flex items-center justify-center">
                      <Minus size={12} />
                    </button>
                    <span className="font-mono text-sm w-5 text-center">{item.qty}</span>
                    <button type="button" onClick={() => adjustQty(item.id, 1)} className="w-6 h-6 rounded-full bg-[#002147]/10 flex items-center justify-center">
                      <Plus size={12} />
                    </button>
                  </div>
                  <div className="flex items-center gap-1.5 justify-end w-14">
                    <Money value={item.price * item.qty} size="sm" />
                  </div>
                  <div className="col-span-3 flex justify-end -mt-1">
                    <button
                      type="button"
                      onClick={() => removeItem(item.id)}
                      className="text-[11px] flex items-center gap-1 text-[#002147] px-2 py-1 rounded-md"
                    >
                      <Trash2 size={12} /> Remove
                    </button>
                  </div>
                </li>
              ))}
            </ul>
          </div>
        )}
      </Card>
    </div>
  );
}

function SellTab({ show, inventory, updateShow, updateInventory }) {
  const [item, setItem] = useState("");
  const [price, setPrice] = useState("");
  const [method, setMethod] = useState("cash");
  const [linkedId, setLinkedId] = useState("");

  const logSale = () => {
    if (!item || !price) return;
    const sale = { id: uid(), item, price: parseFloat(price) || 0, method, ts: Date.now() };
    updateShow({ sales: [sale, ...show.sales] });
    if (linkedId) {
      updateInventory(inventory.map((i) => (i.id === linkedId ? { ...i, qty: Math.max(0, i.qty - 1) } : i)));
    }
    setItem("");
    setPrice("");
    setLinkedId("");
  };

  const pickFromInventory = (inv) => {
    setItem(inv.name);
    setPrice(String(inv.price));
    setLinkedId(inv.id);
  };

  const removeSale = (id) => {
    updateShow({ sales: show.sales.filter((s) => s.id !== id) });
  };

  return (
    <div className="space-y-4">
      <Card className="p-4">
        <SectionLabel>Log a sale</SectionLabel>
        <div className="space-y-2">
          <input
            placeholder="What sold?"
            value={item}
            onChange={(e) => { setItem(e.target.value); setLinkedId(""); }}
            className="w-full border border-[#002147]/20 rounded-lg px-3 py-2 text-sm"
          />
          <div className="flex gap-2">
            <input
              type="number"
              inputMode="decimal"
              placeholder="price"
              value={price}
              onChange={(e) => setPrice(e.target.value)}
              className="flex-1 min-w-0 w-full border border-[#002147]/20 rounded-lg px-3 py-2 text-sm font-mono"
            />
            <div className="flex rounded-lg overflow-hidden border border-[#002147]/30 divide-x divide-[#002147]/30 text-xs">
              {["cash", "card"].map((m) => (
                <button
                  key={m}
                  type="button"
                  onClick={() => setMethod(m)}
                  className={`px-3 py-2 font-medium capitalize ${method === m ? "bg-[#002147] text-[#FFFFFF]" : "bg-[#002147]/5 text-[#002147]"}`}
                >
                  {m}
                </button>
              ))}
            </div>
          </div>
          <button type="button" onClick={logSale} className="w-full bg-[#002147] text-white font-bold text-sm py-3.5 rounded-lg flex items-center justify-center gap-2 shadow-md border-2 border-[#002147]">
            <DollarSign size={16} /> Log sale
          </button>
        </div>
      </Card>

      {inventory.filter((i) => i.qty > 0).length > 0 && (
        <Card className="p-4">
          <SectionLabel>Quick-sell from stock</SectionLabel>
          <div className="space-y-1.5 max-h-60 overflow-y-auto">
            {inventory.filter((i) => i.qty > 0).map((inv) => (
              <button
                key={inv.id}
                onClick={() => pickFromInventory(inv)}
                className="w-full flex items-center justify-between text-left px-3 py-2 rounded-lg hover:bg-[#002147]/5 border border-[#002147]/10"
              >
                <span className="text-sm truncate pr-2">{inv.name} <span className="text-[11px]" style={{ color: "var(--tc-50)" }}>×{inv.qty}</span></span>
                <Money value={inv.price} size="sm" />
              </button>
            ))}
          </div>
        </Card>
      )}

      {show.sales.length > 0 && (
        <Card className="p-4">
          <SectionLabel>This show's sales ({show.sales.length})</SectionLabel>
          <ul className="divide-y divide-[#002147]/8">
            {show.sales.slice(0, 12).map((s) => (
              <li key={s.id} className="py-2 flex items-center justify-between text-sm gap-2">
                <span className="truncate pr-2">{s.item} <span className="text-[10px] uppercase" style={{ color: "var(--tc-40)" }}>{s.method}</span></span>
                <span className="flex items-center gap-2 shrink-0">
                  <Money value={s.price} size="sm" />
                  <button onClick={() => removeSale(s.id)} className="w-6 h-6 rounded-full bg-[#002147]/8 text-[#002147] flex items-center justify-center">
                    <Trash2 size={12} />
                  </button>
                </span>
              </li>
            ))}
          </ul>
        </Card>
      )}
    </div>
  );
}

function BuyTab({ show, updateShow }) {
  const [desc, setDesc] = useState("");
  const [amount, setAmount] = useState("");
  const [kind, setKind] = useState("purchase");

  const log = () => {
    if (!desc || !amount) return;
    const entry = { id: uid(), desc, amount: parseFloat(amount) || 0, ts: Date.now() };
    if (kind === "purchase") {
      updateShow({ purchases: [{ ...entry, cost: entry.amount }, ...show.purchases] });
    } else {
      updateShow({ expenses: [entry, ...show.expenses] });
    }
    setDesc("");
    setAmount("");
  };

  const removeEntry = (id, tag) => {
    if (tag === "stock") updateShow({ purchases: show.purchases.filter((p) => p.id !== id) });
    else updateShow({ expenses: show.expenses.filter((e) => e.id !== id) });
  };

  return (
    <div className="space-y-4">
      <Card className="p-4">
        <SectionLabel>Log spending</SectionLabel>
        <div className="flex rounded-lg overflow-hidden border border-[#002147]/30 divide-x divide-[#002147]/30 text-xs mb-2">
          {[
            { k: "purchase", label: "Bought stock" },
            { k: "expense", label: "Other expense" },
          ].map((o) => (
            <button
              key={o.k}
              type="button"
              onClick={() => setKind(o.k)}
              className={`flex-1 px-3 py-2 font-medium ${kind === o.k ? "bg-[#002147] text-[#FFFFFF]" : "bg-[#002147]/5 text-[#002147]"}`}
            >
              {o.label}
            </button>
          ))}
        </div>
        <div className="space-y-2">
          <input
            placeholder={kind === "purchase" ? "What did you buy? (e.g. binder of singles)" : "What was it for? (e.g. table fee)"}
            value={desc}
            onChange={(e) => setDesc(e.target.value)}
            className="w-full border border-[#002147]/20 rounded-lg px-3 py-2 text-sm"
          />
          <input
            type="number"
            inputMode="decimal"
            placeholder="amount"
            value={amount}
            onChange={(e) => setAmount(e.target.value)}
            className="w-full border border-[#002147]/20 rounded-lg px-3 py-2 text-sm font-mono"
          />
          <button type="button" onClick={log} className="w-full bg-[#002147] text-white font-bold text-sm py-3.5 rounded-lg flex items-center justify-center gap-2 shadow-md border-2 border-[#002147]">
            <Receipt size={16} /> Log it
          </button>
        </div>
      </Card>

      {(show.purchases.length > 0 || show.expenses.length > 0) && (
        <Card className="p-4">
          <SectionLabel>This show's spending</SectionLabel>
          <ul className="divide-y divide-[#002147]/8">
            {[...show.purchases.map((p) => ({ ...p, tag: "stock" })), ...show.expenses.map((e) => ({ ...e, tag: "expense" }))]
              .sort((a, b) => b.ts - a.ts)
              .slice(0, 12)
              .map((r) => (
                <li key={r.id} className="py-2 flex items-center justify-between text-sm gap-2">
                  <span className="truncate pr-2">{r.desc} <span className="text-[10px] uppercase" style={{ color: "var(--tc-40)" }}>{r.tag}</span></span>
                  <span className="flex items-center gap-2 shrink-0">
                    <Money value={r.amount ?? r.cost} size="sm" />
                    <button onClick={() => removeEntry(r.id, r.tag)} className="w-6 h-6 rounded-full bg-[#002147]/8 text-[#002147] flex items-center justify-center">
                      <Trash2 size={12} />
                    </button>
                  </span>
                </li>
              ))}
          </ul>
        </Card>
      )}
    </div>
  );
}

function BottomNav({ tab, setTab }) {
  const items = [
    { k: "summary", label: "Summary", Icon: LayoutGrid },
    { k: "inventory", label: "Stock", Icon: Package },
    { k: "sell", label: "Sell", Icon: DollarSign },
    { k: "buy", label: "Spend", Icon: Receipt },
  ];
  return (
    <nav className="fixed bottom-0 left-0 right-0 bg-white border-t border-[#002147]/10">
      <div className="max-w-md mx-auto grid grid-cols-4">
        {items.map(({ k, label, Icon }) => (
          <button
            key={k}
            onClick={() => setTab(k)}
            className={`flex flex-col items-center gap-0.5 py-2.5 text-[11px] font-medium ${
              tab === k ? "text-[#002147]" : ""
            }`}
            style={tab === k ? undefined : { color: "var(--tc-40)" }}
          >
            <Icon size={18} strokeWidth={tab === k ? 2.5 : 2} />
            {label}
          </button>
        ))}
      </div>
    </nav>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<ShowTracker />);
</script>
</body>
</html>
